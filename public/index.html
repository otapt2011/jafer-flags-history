	tailwind.config = {
		darkMode: 'class',
		theme: {
			extend: {
				screens: {
					'xs': '380px'
				},
				animation: {
					'pulse-once': 'pulse 0.4s ease-in-out',
					'pop-in': 'popIn 0.25s ease-out',
				},
				keyframes: {
					popIn: {

	<style>
	:root {
		--like-color: #ef4444;
		--fav-color: #eab308;
		--save-color: #3b82f6;
	}
	
	* {
		-webkit-tap-highlight-color: transparent;
	}
	
	html,
	body {
		overflow: hidden;
		height: 100%;
		width: 100%;
		position: fixed;
		top: 0;
		left: 0;
	}
	
	#app-root {
		height: 100dvh;
		height: 100vh;
		width: 100vw;
		display: flex;
		flex-direction: column;
		overflow: hidden;
	}
	
	.flag-stripe {
		height: 33.333%;
		width: 100%;
	}
	
	.flag-emblem {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		pointer-events: none;
		z-index: 2;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	
	.interaction-btn {
		transition: all 0.2s ease;
		backdrop-filter: blur(6px);
		-webkit-backdrop-filter: blur(6px);
	}
	
	.interaction-btn:active {
		transform: scale(0.85);
	}
	
	.modal-backdrop {
		backdrop-filter: blur(4px);
		-webkit-backdrop-filter: blur(4px);
	}
	
	.flag-card {
		transition: transform 0.18s ease, box-shadow 0.18s ease;
		cursor: pointer;
	}
	
	.flag-card:active {
		transform: scale(0.97);
	}
	
	@media (hover: hover) {
		.flag-card:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
		}
		.dark .flag-card:hover {
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
		}
		.flag-card:hover .interaction-btn {
			opacity: 1;
		}
	}
	
	.scrollbar-thin::-webkit-scrollbar {
		width: 3px;
	}
	
	.scrollbar-thin::-webkit-scrollbar-track {
		background: transparent;
	}
	
	.scrollbar-thin::-webkit-scrollbar-thumb {
		background: #cbd5e1;
		border-radius: 10px;
	}
	
	.dark .scrollbar-thin::-webkit-scrollbar-thumb {
		background: #475569;
	}
	
	.emblem-icon {
		font-size: 1.1rem;
	}
	
	.emblem-icon-lg {
		font-size: 1.8rem;
	}
	
	.btn-icon {
		font-size: 0.7rem;
	}
	
	#modal-backdrop {
		transition: opacity 0.2s ease-out;
	}
	
	#modal-content-wrapper {
		transition: opacity 0.2s ease-out, transform 0.2s ease-out;
	}
	/* Initial (hidden) state */
	
	.modal-transition {
		transition: opacity 0.25s ease-out, transform 0.25s ease-out;
	}
	
	.modal-hidden {
		opacity: 0;
		transform: scale(0.95);
		pointer-events: none;
	}
	
	.modal-visible {
		opacity: 1;
		transform: scale(1);
		pointer-events: auto;
	}
	
	.dark .flag-card img {
		filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.2));
	}
	
	.modal-flag-image img {
		filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
	}
	
	.dark .modal-flag-image img {
		filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.2));
	}
	/* Gradient text animation */
	
	.gradient-text {
		background: linear-gradient(90deg, #10b981, #6366f1, #f59e0b, #10b981);
		background-size: 300% 100%;
		-webkit-background-clip: text;
		background-clip: text;
		-webkit-text-fill-color: transparent;
		color: transparent;
		/* fallback */
		animation: gradientShift 4s ease-in-out infinite;
	}
	
	@keyframes gradientShift {
		0% {
			background-position: 0% 50%;
		}
		50% {
			background-position: 100% 50%;
		}
		100% {
			background-position: 0% 50%;
		}
	}
	
	.dark .gradient-text {
		background: linear-gradient(90deg, #34d399, #818cf8, #fbbf24, #34d399);
		background-size: 300% 100%;
		-webkit-background-clip: text;
		background-clip: text;
		-webkit-text-fill-color: transparent;
	}
	
	* {
		scrollbar-width: none;
		-ms-overflow-style: none;
	}
	
	*::-webkit-scrollbar {
		display: none;
	}
	</style>
	<style>
	/* Skeleton loading animation */
	
	.skeleton-card {
		background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
		background-size: 200% 100%;
		animation: shimmer 1.5s infinite;
		border-radius: 0.5rem;
	}
	
	.dark .skeleton-card {
		background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
		background-size: 200% 100%;
	}
	
	@keyframes shimmer {
		0% {
			background-position: 200% 0;
		}
		100% {
			background-position: -200% 0;
		}
	}
	
	.skeleton-img {
		height: clamp(60px, 9vh, 90px);
		border-radius: 6px 6px 0 0;
	}
	
	.skeleton-text {
		height: 10px;
		margin: 8px 0;
		border-radius: 4px;
		width: 80%;
	}
	
	.skeleton-text.short {
		width: 50%;
	}
	/* Skeleton shimmer animation */
	
	@keyframes shimmer {
		0% {
			background-position: 200% 0;
		}
		100% {
			background-position: -200% 0;
		}
	}
	
	.skeleton-animate {
		background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
		background-size: 200% 100%;
		animation: shimmer 1.5s infinite;
	}
	
	.dark .skeleton-animate {
		background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
		background-size: 200% 100%;
	}
	</style>
</head>

	<script>
	// ──────────────────────────────────────────────────────────────
	// Module 1: Flag Data & Persistence (FIXED)
	(function(App) {
		'use strict';
		const DEFAULT_DATA = [ /* ... your 20 flag objects ... */ ];
		const STORAGE_KEY = 'ethiopia-flags-data';
		let flagData = [];
		const DATA_URL = 'https://flags-scrapper-api.vercel.app/flags-data.json';
		async function loadFlagData() {
			try {
				const response = await fetch(DATA_URL);
				if(!response.ok) throw new Error('Network error');
				flagData = await response.json();
				localStorage.setItem(STORAGE_KEY, JSON.stringify(flagData)); // ← use STORAGE_KEY
			} catch(e) {
				const stored = localStorage.getItem(STORAGE_KEY);
				flagData = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(DEFAULT_DATA));
			}
			flagData.forEach(f => {
				if(!f.country) f.country = 'Ethiopia';
				if(f.imageBlob === undefined) f.imageBlob = null;
			});
			App.flagData = flagData;
		}

		function loadFlagDatas() {
			try {
				const stored = localStorage.getItem(STORAGE_KEY);
				if(stored) {
					flagData = JSON.parse(stored);
					if(!Array.isArray(flagData) || flagData.length === 0) throw new Error('empty');
					flagData.forEach(f => {
						if(!f.country) f.country = 'Ethiopia';
						if(f.imageBlob === undefined) f.imageBlob = null;
					});
					App.flagData = flagData; // ← update the shared reference
					return;
				}
			} catch(e) { /* fall back to defaults */ }
			flagData = JSON.parse(JSON.stringify(DEFAULT_DATA));
			App.flagData = flagData; // ← also update here
			saveFlagData();
		}

		function saveFlagData() {
			try {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(flagData));
			} catch(e) { /* quota exceeded */ }
		}
		// Expose to shared namespace
		App.flagData = flagData; // set initially (will be overwritten correctly later)
		App.loadFlagData = loadFlagData;
		App.saveFlagData = saveFlagData;
		App.DEFAULT_FLAG_DATA = DEFAULT_DATA;
	})(window.FlagApp);
	</script>
	<script>
	// ──────────────────────────────────────────────────────────────
	// Module 2: User Interactions (like / favourite / save)
	// ──────────────────────────────────────────────────────────────
	(function(App) {
		'use strict';
		const STORAGE_KEY = 'ethiopia-flags-interactions';
		let interactions = {};

		function loadInteractions() {
			try {
				const stored = localStorage.getItem(STORAGE_KEY);
				if(stored) interactions = JSON.parse(stored);
			} catch(e) {
				interactions = {};
			}
			App.flagData.forEach(f => {
				if(!interactions[f.id]) interactions[f.id] = {
					liked: false,
					favorited: false,
					saved: false
				};
			});
		}

		function saveInteractions() {
			try {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(interactions));
			} catch(e) { /* */ }
		}

		function getInteraction(flagId, type) {
			return interactions[flagId] && interactions[flagId][type] === true;
		}

		function toggleInteraction(flagId, type) {
			if(!interactions[flagId]) interactions[flagId] = {
				liked: false,
				favorited: false,
				saved: false
			};
			interactions[flagId][type] = !interactions[flagId][type];
			saveInteractions();
		}
		App.interactions = interactions;
		App.loadInteractions = loadInteractions;
		App.getInteraction = getInteraction;
		App.toggleInteraction = toggleInteraction;
	})(window.FlagApp);
	</script>
	<script>
	// ──────────────────────────────────────────────────────────────
	// Module 3: Theme Management
	// ──────────────────────────────────────────────────────────────
	(function(App) {
		'use strict';
		const THEME_KEY = 'ethiopia-flags-theme';

		function getTheme() {
			try {
				const stored = localStorage.getItem(THEME_KEY);
				if(stored) return stored;
			} catch(e) { /* */ }
			return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
		}

		function applyTheme(theme) {
			document.documentElement.classList.toggle('dark', theme === 'dark');
			document.documentElement.classList.toggle('light', theme !== 'dark');
			try {
				localStorage.setItem(THEME_KEY, theme);
			} catch(e) { /* */ }
			const btn = document.getElementById('theme-toggle');
			if(btn) {
				btn.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
			}
		}

		function toggleTheme() {
			const current = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
			applyTheme(current === 'dark' ? 'light' : 'dark');
		}
		App.getTheme = getTheme;
		App.applyTheme = applyTheme;
		App.toggleTheme = toggleTheme;
	})(window.FlagApp);
	</script>

	// ──────────────────────────────────────────────────────────────
	// Module 4: Emblem Rendering
	// ──────────────────────────────────────────────────────────────
	(function(App) {
		'use strict';

		function getEmblemIconAndColor(emblemType) {
			switch(emblemType) {
				case 'lion':
				case 'lion_crown':
				case 'lion_crown_large':
				case 'lion_elaborate':
					return {
						iconClass: 'fa-solid fa-crown',
						bgColor: '#c89902',
						iconColor: '#5c3d00'
					};
				case 'cross':
					return {
						iconClass: 'fa-solid fa-cross',
						bgColor: '#fcdd09',
						iconColor: '#5c3d00'
					};
				case 'derg_emblem':
					return {
						iconClass: 'fa-solid fa-gear',
						bgColor: '#f5e6b8',
						iconColor: '#8b4513'
					};
				case 'pdre_emblem':
				case 'pdre_simple':
					return {
						iconClass: 'fa-solid fa-star',
						bgColor: '#e8d5a0',
						iconColor: '#a0522d'
					};
				case 'star_disc':
				case 'star_disc_proto':
					return {
						iconClass: 'fa-solid fa-star',
						bgColor: '#1a6fb5',
						iconColor: '#fcdd09'
					};
				case 'italian':
					return {
						iconClass: 'fa-solid fa-flag',
						bgColor: '#ffffff',
						iconColor: '#888888'
					};
				default:
					return null;
			}
		}

		function createEmblemHTML(emblemType, size) {
			size = size || 'small';
			if(!emblemType || emblemType === 'none') return '';
			const iconData = getEmblemIconAndColor(emblemType);
			if(!iconData) return '';
			const isLarge = size === 'large';
			const circleSize = isLarge ? '3rem' : '2rem';
			const iconSizeClass = isLarge ? 'emblem-icon-lg' : 'emblem-icon';
			return `<div class="flag-emblem" style="width:${circleSize}; height:${circleSize}; border-radius:50%; background:${iconData.bgColor}; border:1px solid rgba(0,0,0,0.2);"><i class="${iconData.iconClass} ${iconSizeClass}" style="color:${iconData.iconColor};"></i></div>`;
		}
		App.getEmblemIconAndColor = getEmblemIconAndColor;
		App.createEmblemHTML = createEmblemHTML;
	})(window.FlagApp);
	</script>

	(function(App) {

			const containerStyle = `position:relative;width:100%;height:100%;overflow:hidden;border-radius:${size === 'large' ? '0' : '6px 6px 0 0'};`;

			}

		function renderFlagGrid() {

        <div class="relative flex-shrink-0" style="height: clamp(60px, 9vh, 90px);">${App.createFlagImageHTML(flag, 'small')}
          <div class="absolute top-1 right-1 flex flex-col gap-1 z-10">
            <button class="interaction-btn like-btn w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center text-xs transition-all ${liked ? 'text-red-500 bg-red-100 dark:bg-red-900/20' : 'bg-white/70 dark:bg-gray-800/70 text-gray-400 dark:text-gray-500 hover:bg-white/90 dark:hover:bg-gray-700/90'}" data-flag-id="${flag.id}" data-type="liked" aria-label="Like"><i class="${liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'} btn-icon"></i></button>
            <button class="interaction-btn fav-btn w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center text-xs transition-all ${favorited ? 'text-yellow-500 bg-yellow-100 dark:bg-yellow-900/20' : 'bg-white/70 dark:bg-gray-800/70 text-gray-400 dark:text-gray-500 hover:bg-white/90 dark:hover:bg-gray-700/90'}" data-flag-id="${flag.id}" data-type="favorited" aria-label="Favorite"><i class="${favorited ? 'fa-solid fa-star' : 'fa-regular fa-star'} btn-icon"></i></button>
            <button class="interaction-btn save-btn w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center text-xs transition-all ${saved ? 'text-blue-500 bg-blue-100 dark:bg-blue-900/20' : 'bg-white/70 dark:bg-gray-800/70 text-gray-400 dark:text-gray-500 hover:bg-white/90 dark:hover:bg-gray-700/90'}" data-flag-id="${flag.id}" data-type="saved" aria-label="Save"><i class="${saved ? 'fa-solid fa-bookmark' : 'fa-regular fa-bookmark'} btn-icon"></i></button>
          </div>
        </div>
        <div class="flex-1 flex flex-col justify-center px-2 py-1.5 sm:px-3 sm:py-2 min-w-0">
          <span class="text-[10px] sm:text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider truncate">${flag.period}</span>
          <span class="text-[11px] sm:text-xs md:text-sm font-medium text-gray-800 dark:text-gray-200 truncate mt-0.5">${flag.ruler}</span>

			attachGridEvents();
			if(typeof App.populateUpdaterSelect === 'function') App.populateUpdaterSelect();

		function attachGridEvents() {
			flagGrid.querySelectorAll('.flag-card').forEach(card => {
				card.addEventListener('click', function(e) {
					if(e.target.closest('.interaction-btn')) return;
					App.openModal(parseInt(this.getAttribute('data-flag-id')));
				});
			});
			flagGrid.querySelectorAll('.interaction-btn').forEach(btn => {
				btn.addEventListener('click', function(e) {
					e.stopPropagation();
					e.preventDefault();
					const fid = parseInt(this.getAttribute('data-flag-id'));
					const type = this.getAttribute('data-type');
					App.toggleInteraction(fid, type);
					updateButtonVisual(this, fid, type);
					if(App.currentModalFlagId === fid) App.updateModalInteractions(fid);
				});
			});
		}

		function updateButtonVisual(btn, flagId, type) {
			const isActive = App.getInteraction(flagId, type);
			const icons = {
				liked: {
					active: 'fa-solid fa-heart',
					inactive: 'fa-regular fa-heart'
				},
				favorited: {
					active: 'fa-solid fa-star',
					inactive: 'fa-regular fa-star'
				},
				saved: {
					active: 'fa-solid fa-bookmark',
					inactive: 'fa-regular fa-bookmark'
				},
			};
			const colorClasses = {
				liked: 'text-red-500 bg-red-100 dark:bg-red-900/20',
				favorited: 'text-yellow-500 bg-yellow-100 dark:bg-yellow-900/20',
				saved: 'text-blue-500 bg-blue-100 dark:bg-blue-900/20',
			};
			const inactiveClasses = 'bg-white/70 dark:bg-gray-800/70 text-gray-400 dark:text-gray-500 hover:bg-white/90 dark:hover:bg-gray-700/90';
			btn.innerHTML = `<i class="${icons[type][isActive ? 'active' : 'inactive']} btn-icon"></i>`;
			btn.className = btn.className.replace(/bg-\w+(-\w+)?(\/\d+)?/g, '').replace(/text-\w+(-\w+)?/g, '').replace(/shadow-md/g, '').replace(/hover:bg-\w+\/\d+/g, '');
			if(isActive) {
				btn.classList.add(...colorClasses[type].split(' '));
			} else {
				btn.classList.add(...inactiveClasses.split(' '));
			}
			btn.classList.add('animate-pulse-once');
			setTimeout(() => btn.classList.remove('animate-pulse-once'), 400);
		}
		// Expose
		App.renderFlagGrid = renderFlagGrid;
		App.attachGridEvents = attachGridEvents;
		App.updateButtonVisual = updateButtonVisual;
		App.flagGrid = flagGrid;

	<script>
	// ──────────────────────────────────────────────────────────────
	// Module 7: Flag Detail Modal
	// ──────────────────────────────────────────────────────────────
	(function(App) {
		'use strict';
		const modal = document.getElementById('flag-modal');
		const modalBackdrop = document.getElementById('modal-backdrop');
		const modalClose = document.getElementById('modal-close');
		const modalFlagImage = document.getElementById('modal-flag-image');
		const modalPeriod = document.getElementById('modal-period');
		const modalRuler = document.getElementById('modal-ruler');
		const modalDescription = document.getElementById('modal-description');
		const modalInteractions = document.getElementById('modal-interactions');
		let currentModalFlagId = null;
		App.currentModalFlagId = currentModalFlagId; // share reference (updated via getter/setter pattern)
		function openModal(flagId) {
			const flag = App.flagData.find(f => f.id === flagId);
			if(!flag) return;
			currentModalFlagId = flagId;
			App.currentModalFlagId = flagId;
			// Fill content
			modalFlagImage.innerHTML = App.createFlagImageHTML(flag, 'large');
			modalPeriod.textContent = `${flag.country} · ${flag.period}`;
			modalRuler.textContent = flag.ruler;
			modalDescription.textContent = flag.description;
			updateModalInteractions(flagId);
			// Show the modal (remove display:none) – it's still visually hidden via .modal-hidden
			modal.classList.remove('hidden');
			modal.setAttribute('aria-hidden', 'false');
			// Force the browser to paint the initial hidden state
			void modalBackdrop.offsetWidth; // triggers reflow
			void document.getElementById('modal-content-wrapper').offsetWidth;
			// Now animate to visible
			requestAnimationFrame(() => {
				requestAnimationFrame(() => { // double rAF for safety
					modalBackdrop.classList.add('modal-visible');
					modalBackdrop.classList.remove('modal-hidden');
					const wrapper = document.getElementById('modal-content-wrapper');
					if(wrapper) {
						wrapper.classList.add('modal-visible');
						wrapper.classList.remove('modal-hidden');
					}
				});
			});
		}

		function closeModal() {
			// Animate out
			modalBackdrop.classList.add('modal-hidden');
			modalBackdrop.classList.remove('modal-visible');
			const wrapper = document.getElementById('modal-content-wrapper');
			if(wrapper) {
				wrapper.classList.add('modal-hidden');
				wrapper.classList.remove('modal-visible');
			}
			// Wait for transition to end, then hide completely
			setTimeout(() => {
				modal.classList.add('hidden');
				modal.setAttribute('aria-hidden', 'true');
				currentModalFlagId = null;
				App.currentModalFlagId = null;
			}, 250); // same as CSS transition duration
		}

		function updateModalInteractions(flagId) {
			const liked = App.getInteraction(flagId, 'liked');
			const favorited = App.getInteraction(flagId, 'favorited');
			const saved = App.getInteraction(flagId, 'saved');
			modalInteractions.innerHTML = `
      <button class="modal-int-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${liked ? 'bg-red-500 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700'}" data-flag-id="${flagId}" data-type="liked"><i class="${liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i> Like</button>
      <button class="modal-int-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${favorited ? 'bg-yellow-500 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700'}" data-flag-id="${flagId}" data-type="favorited"><i class="${favorited ? 'fa-solid fa-star' : 'fa-regular fa-star'}"></i> Favorite</button>
      <button class="modal-int-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${saved ? 'bg-blue-500 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700'}" data-flag-id="${flagId}" data-type="saved"><i class="${saved ? 'fa-solid fa-bookmark' : 'fa-regular fa-bookmark'}"></i> Save</button>`;
			modalInteractions.querySelectorAll('.modal-int-btn').forEach(btn => {
				btn.addEventListener('click', function(e) {
					e.stopPropagation();
					const fid = parseInt(this.getAttribute('data-flag-id'));
					const type = this.getAttribute('data-type');
					App.toggleInteraction(fid, type);
					updateModalInteractions(fid);
					const gridBtn = App.flagGrid.querySelector(`.interaction-btn[data-flag-id="${fid}"][data-type="${type}"]`);
					if(gridBtn) App.updateButtonVisual(gridBtn, fid, type);
				});
			});
		}
		// Events
		modalClose.addEventListener('click', closeModal);
		modalBackdrop.addEventListener('click', closeModal);
		document.addEventListener('keydown', function(e) {
			if(e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
		});
		// ── Image Proxy URL (for cross‑origin downloads) ─────
		const IMAGE_PROXY = 'https://flags-scrapper-api.vercel.app/api/image-proxy?url=';
		// ── Download button handler ───────────────────────────
		const downloadBtn = document.getElementById('downloadFlag');
		if(downloadBtn) {
			downloadBtn.addEventListener('click', async() => {
				// Find the current flag image inside the modal
				const img = document.querySelector('#modal-flag-image img');
				if(!img) {
					alert('No image to download.');
					return;
				}
				const src = img.src;
				let blobUrl = null;
				try {
					if(src.startsWith('blob:')) {
						// Direct download for blob URLs
						const a = document.createElement('a');
						a.href = src;
						a.download = 'flag.png';
						a.click();
						return;
					}
					// For remote URLs, fetch through the image proxy
					const proxyUrl = IMAGE_PROXY + encodeURIComponent(src);
					const response = await fetch(proxyUrl);
					if(!response.ok) throw new Error('Fetch failed');
					const blob = await response.blob();
					blobUrl = URL.createObjectURL(blob);
					const a = document.createElement('a');
					a.href = blobUrl;
					a.download = 'flag.png';
					a.click();
				} catch(err) {
					alert('Download failed. The image might be blocked by CORS.');
					console.error(err);
				} finally {
					if(blobUrl) URL.revokeObjectURL(blobUrl);
				}
			});
		}
		// Expose
		App.openModal = openModal;
		App.closeModal = closeModal;
		App.updateModalInteractions = updateModalInteractions;
	})(window.FlagApp);
	</script>
	<script>
	// ──────────────────────────────────────────────────────────────
	// Module 8: Data Updater Modal
	// ──────────────────────────────────────────────────────────────
	(function(App) {
		'use strict';
		const updaterModal = document.getElementById('updater-modal');
		const updaterBackdrop = document.getElementById('updater-backdrop');
		const updaterClose = document.getElementById('updater-close');
		const updaterOpen = document.getElementById('updater-open');
		const updaterSelect = document.getElementById('updater-select');
		const updaterId = document.getElementById('updater-id');
		const updaterCountry = document.getElementById('updater-country');
		const updaterPeriod = document.getElementById('updater-period');
		const updaterRuler = document.getElementById('updater-ruler');
		const updaterEmblem = document.getElementById('updater-emblem');
		const updaterImageUrl = document.getElementById('updater-imageUrl');
		const updaterImageBlob = document.getElementById('updater-imageBlob');
		const updaterDescription = document.getElementById('updater-description');
		const updaterColor1 = document.getElementById('updater-color1');
		const updaterColor2 = document.getElementById('updater-color2');
		const updaterColor3 = document.getElementById('updater-color3');
		const updaterUpdate = document.getElementById('updater-update');

		function populateUpdaterSelect() {
			updaterSelect.innerHTML = App.flagData.map(f => `<option value="${f.id}">${f.country} · ${f.period} – ${f.ruler}</option>`).join('');
			if(App.flagData.length > 0) {
				updaterSelect.value = App.flagData[0].id;
				populateUpdaterFields(App.flagData[0].id);
			}
		}

		function populateUpdaterFields(flagId) {
			const flag = App.flagData.find(f => f.id === flagId);
			if(!flag) return;
			updaterId.value = flag.id;
			updaterCountry.value = flag.country || 'Ethiopia';
			updaterPeriod.value = flag.period;
			updaterRuler.value = flag.ruler;
			updaterEmblem.value = flag.emblem || 'none';
			updaterImageUrl.value = flag.imageUrl || '';
			updaterImageBlob.value = (flag.imageBlob && flag.imageBlob.length > 0) ? 'BLOB stored' : 'No BLOB stored';
			updaterDescription.value = flag.description;
			updaterColor1.value = flag.flagColors[0] || '#078930';
			updaterColor2.value = flag.flagColors[1] || '#fcdd09';
			updaterColor3.value = flag.flagColors[2] || '#da121a';
		}

		function openUpdaterModal() {
			populateUpdaterSelect();
			updaterModal.classList.remove('hidden');
			updaterModal.setAttribute('aria-hidden', 'false');
		}

		function closeUpdaterModal() {
			updaterModal.classList.add('hidden');
			updaterModal.setAttribute('aria-hidden', 'true');
		}
		// Events
		updaterSelect.addEventListener('change', function() {
			populateUpdaterFields(parseInt(this.value));
		});
		updaterUpdate.addEventListener('click', function() {
			const id = parseInt(updaterId.value);
			const idx = App.flagData.findIndex(f => f.id === id);
			if(idx === -1) return;
			App.flagData[idx].country = updaterCountry.value.trim() || 'Ethiopia';
			App.flagData[idx].period = updaterPeriod.value.trim();
			App.flagData[idx].ruler = updaterRuler.value.trim();
			App.flagData[idx].emblem = updaterEmblem.value;
			App.flagData[idx].imageUrl = updaterImageUrl.value.trim();
			App.flagData[idx].description = updaterDescription.value.trim();
			App.flagData[idx].flagColors = [
				updaterColor1.value.trim() || '#078930',
				updaterColor2.value.trim() || '#fcdd09',
				updaterColor3.value.trim() || '#da121a'
			];
			App.saveFlagData();
			App.renderFlagGrid();
			closeUpdaterModal();
		});
		updaterOpen.addEventListener('click', openUpdaterModal);
		updaterClose.addEventListener('click', closeUpdaterModal);
		updaterBackdrop.addEventListener('click', closeUpdaterModal);
		document.addEventListener('keydown', function(e) {
			if(e.key === 'Escape' && !updaterModal.classList.contains('hidden')) closeUpdaterModal();
		});
		// Expose
		App.populateUpdaterSelect = populateUpdaterSelect;
		App.openUpdaterModal = openUpdaterModal;
		App.closeUpdaterModal = closeUpdaterModal;
	})(window.FlagApp);
	</script>
	<script>
	// ──────────────────────────────────────────────────────────────
	// Module 9: Initialisation
	// ──────────────────────────────────────────────────────────────
	(function(App) {
		'use strict';
		// Apply theme instantly (before any data loading)
		(function applyThemeImmediately() {
			const theme = App.getTheme();
			App.applyTheme(theme);
		})();

		function extractStartYear(periodStr) {
			const match = periodStr.match(/\b(1[0-9]{3}|20[0-9]{2})\b/);
			return match ? match[0] : periodStr;
		}

		function updateFooter() {
			const count = App.flagData.length;
			if(count === 0) return;
			const firstFlag = App.flagData[0];
			const lastFlag = App.flagData[count - 1];
			const country = firstFlag.country || 'Ethiopia';
			const startYear = extractStartYear(firstFlag.period);
			const endYear = extractStartYear(lastFlag.period);
			const footerEl = document.getElementById('footer-info');
			if(footerEl) {
				footerEl.textContent = `${count} Flags · ${country} · ${startYear}–${endYear}`;
			}
		}

		function waitForGridToRender(expectedCount) {
			return new Promise(resolve => {
				const grid = document.getElementById('flag-grid');

				function check() {
					if(grid.children.length >= expectedCount) {
						resolve();
					} else {
						requestAnimationFrame(check);
					}
				}
				requestAnimationFrame(check);
			});
		}
		// Expose
		App.updateFooter = updateFooter;
		async function init() {
			await App.loadFlagData();
			App.loadInteractions();
			App.applyTheme(App.getTheme());
			App.renderFlagGrid();
			await waitForGridToRender(App.flagData.length);
			if(typeof App.populateUpdaterSelect === 'function') App.populateUpdaterSelect();
			updateFooter();
			setTimeout(() => {
				//requestAnimationFrame(() => {
				//requestAnimationFrame(() => {
				App.openModal(3);
				//});
				//});
			}, 3000);
		}
		// Theme toggle button
		document.getElementById('theme-toggle').addEventListener('click', App.toggleTheme);
		// Listen for system theme changes
		window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
			const stored = localStorage.getItem('ethiopia-flags-theme');
			if(!stored) App.applyTheme(e.matches ? 'dark' : 'light');
		});
		// Kick off
		if(document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', init);
		} else {
			init();
		}
	})(window.FlagApp);
	</script>
